    why: |-
      Recruiters in many markets open with "what are you on now?", and a candidate coming from
      such a market answers it reflexively and anchors themselves. Neither the Dutch recruitment
      code's payslip rule nor the EU right to a pay range appears in any posting, and the national
      implementation state is exactly the kind of thing that is impossible to infer from the vacancy.
  - id: "nl-regulated-profession-needs-formal-recognition"
    text_en: |-
      If the role is a regulated profession, a diploma evaluation is not the thing that unlocks
      it. Business.gov.nl separates the credential evaluation from the recognition: having a foreign
      diploma evaluated by the Information centre for credential evaluation (IDW) is, in its words,
      not required, whereas you apply for recognition of your professional qualifications with
      the competent authority for your profession — and only people who meet the requirements are
      allowed to work in a regulated profession. The same page points to the European Union's Regulated
      Professions Database for which professions are regulated in the Netherlands, and to Nuffic's
      National Contact Point for the status of a foreign diploma. So find the competent authority
      and what its procedure requires before you rely on any start date: no amount of employer
      goodwill substitutes for the recognition.
    text_zh: |-
      如果岗位属于"受管制职业"(regulated profession)，学历认证并不等于执业
      资格。荷兰官方 Business.gov.nl 把学历评估和资格承认分开：把国外文凭交给学历
      评估机构 IDW 评估，按其原话是"并非必需"；而要执业，你需要向该职业的主管机构申请对你专
      业资格的正式承认——因为只有符合要求的人才被允许从事受管制职业。同一页面指向欧盟 Regulated
      Professions Database 查询荷兰哪些职业受管制，并指向 Nuffic 的国
      家联络点了解国外文凭在荷兰的地位。所以请先找到主管机构、弄清其程序要求，再去承诺任何入职日期
      ：雇主再有诚意也替代不了这项承认。
    applies_when: "Applying to a role in a regulated profession in the Netherlands (and, with its own competent authorities, elsewhere in the EU/EEA) — for example healthcare professions, teaching, and other professions listed in the EU Regulated Professions Database."
