    why: |-
      A posting names the qualification it wants and sometimes the register, but not the sequence,
      the authority, or the fact that a paid diploma evaluation — the thing candidates most often
      buy first — is the wrong instrument and confers nothing. The delay is discovered after the
      offer, when it is most expensive.

