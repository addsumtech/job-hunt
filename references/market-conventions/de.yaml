    why: |-
      The posting never mentions the works council, and no interviewer volunteers it. A candidate
      reads a long post-interview gap as a soft no and disengages, or is startled that a pay grade
      was fixed and reviewed by a third party before any contract reached them.
  - id: "de-your-notice-period-sets-the-start-date"
    text_en: |-
      "Earliest possible start date" is not a preference question in Germany, it is a legal one.
      Your own resignation runs on a statutory default notice tied to the middle or the end of
      a calendar month; the longer notice periods that grow with length of service are the ones
      the EMPLOYER owes you, and they bind your side only where your contract or an applicable
      collective agreement says so — which is common enough that you must read the clause rather
      than assume the default. During an agreed probationary period a much shorter notice applies
      in both directions, and statutory protection against socially unjustified dismissal begins
      only after an initial continuous waiting period AND only in establishments above a small-business
      size threshold — so the early phase of a new job, and a job at a very small employer, are
      genuinely different legal states. Work out your own notice from your contract before you
      name a date, and treat the probation clause and the notice terms in the new contract as negotiable
      items alongside pay.
    text_zh: |-
      在德国，「最早可入职时间」不是偏好题，是法律题。你自己辞职适用的是法定默认通知期，以日历月的
      月中或月末为终点；而随工龄延长的那套更长的通知期，是雇主解雇你时须遵守的，只有当你的劳动合同
      或适用的集体合同如此约定，才同样约束你一方——这种约定并不少见，所以务必去读条款，别默认按法
      定最短算。在约定的试用期内，双方适用远短得多的通知期；针对「社会性不当解雇」的法定解雇保护，
      既要连续雇佣满一段等待期才生效，也只适用于规模超过「小企业」门槛的单位——也就是说，新工作的
      最初阶段，以及在极小规模雇主处的工作，在法律上确实是另一种状态。报日期之前，先按你的合同算清
      自己的通知期；并且把新合同里的试用期条款和通知期条款，与薪资一起当作可谈判事项。
    applies_when: "From the moment a German application form or interviewer asks for your Eintrittstermin, and again when the contract draft arrives."
    added: "2026-08-09"
    review_by: "2027-08-09"
    source:
      kind: "published"
      publisher: "Bundesministerium der Justiz / juris"
      title: "§ 622 BGB - Einzelnorm (Bürgerliches Gesetzbuch)"
      url: "https://www.gesetze-im-internet.de/bgb/__622.html"
      retrieved: "2026-08-09"
      quote: "Das Arbeitsverhältnis … kann mit einer Frist von vier Wochen zum Fünfzehnten oder zum Ende eines Kalendermonats gekündigt werden. … Für eine Kündigung durch den Arbeitgeber beträgt die Kündigungsfrist, wenn das Arbeitsverhältnis …"
      note: "The ladder that lengthens with length of service is the EMPLOYER's side of the notice. The employee's own resignation runs on the statutory default unless the contract or an applicable collective agreement extends it, and the employee's period may not exceed the employer's."
      also:
        - publisher: "Bundesministerium der Justiz / juris"
          title: "§ 1 KSchG - Einzelnorm (Kündigungsschutzgesetz)"
          url: "https://www.gesetze-im-internet.de/kschg/__1.html"
          retrieved: "2026-08-09"
          quote: "ohne Unterbrechung länger als sechs Monate"
        - publisher: "Bundesministerium der Justiz / juris"
          title: "§ 23 KSchG - Einzelnorm"
          url: "https://www.gesetze-im-internet.de/kschg/__23.html"
          retrieved: "2026-08-09"
          quote: "the first section of the Act does not apply in establishments at or below the stated small-business size for employment begun after the stated date"
    why: |-
      The posting asks for a start date in one line, as though it were up to you. Candidates name
      a date they cannot lawfully hit and then have to walk it back, or sign a probation clause
      without registering that the protections they are picturing have not switched on yet.
  - id: "de-public-sector-pay-is-classified-not-negotiated"
    text_en: |-
      In the German public sector, and in bodies that apply the public-sector collective agreements,
      your pay is not negotiated — it is classified. The pay group follows from the task profile
      of the post under the collective pay order, and federal guidance calls this automatic: you
      are in the group whose activity characteristics your actual, non-temporary duties match.
      What is genuinely decidable at hiring is your step within that group, which turns on prior
      professional experience equivalent to the new duties; federal labour case law asks whether
      you could take the new role on in full immediately, without meaningful induction, and refuses
      to infer equivalence from a theoretical transferability of tasks. So build an evidenced argument
      that your previous duties were the same duties, rather than asking for a higher number.
    text_zh: |-
      在德国公共部门、以及适用公共部门集体合同的机构里，薪酬不是谈出来的，是「归类」出来的。薪级组
      （Entgeltgruppe）由岗位在集体薪酬规程下的职务特征决定，联邦层面的指引称之为「自
      动定级」：你实际长期承担的工作对应哪一组的职务特征，你就在那一组。招聘环节真正可以争取的，是
      这一组里的档级（Stufe），它取决于你此前与新岗位职责相当的工作经验；联邦劳动法院的判断标
      准是：你能否在入职后立即完整胜任新工作、无需明显的培训适应期，并且明确拒绝仅凭「任务在理论上
      可迁移」来推定相当性。所以要做的是拿证据论证「我以前做的就是这份工作」，而不是去要一个更高的
      数字。
    applies_when: "Applying to a German university, research institute, hospital, agency, municipality or any employer whose advertisement names a pay group under a public-sector collective agreement."
    added: "2026-08-09"
    review_by: "2027-02-09"
    source:
      kind: "published"
      publisher: "Bundesverwaltungsamt – Beratungszentrum des Bundes, Referat Eingruppierungsfragen"
      title: "Die unbestimmten Rechtsbegriffe des Teil I der Anlage 1 des Tarifvertrages über die Entgeltordnung des Bundes (TV EntgO Bund) – Definitionskatalog, Köln, tenth edition July 2022 (status 30 August 2022) — the FEDERAL collective agreement"
      url: "https://www.bva.bund.de/SharedDocs/Downloads/DE/Behoerden/Beratung/Eingruppierung/Eingruppierung/20150722_Definitionskatalog_TV_EntgO_Bund.pdf?__blob=publicationFile&v=2"
      retrieved: "2026-08-09"
      quote: "Die/Der Beschäftigte ist in der Entgeltgruppe eingruppiert (Tarifautomatik), deren Tätigkeitsmerkmalen die gesamte von ihr/ihm nicht nur vorübergehend auszuübende Tätigkeit entspricht."
      note: "The two citations cover different collective agreements — the catalogue is the federal one, the court decision is on the Länder one — and together they span both. A reader checking one against the other needs to know that, which the original citation did not say."
      also:
        - publisher: "Bundesarbeitsgericht"
          title: "Decision 6 AZR 205/20 of 18 February 2021, on § 16 Abs. 2 TV-L — the LÄNDER collective agreement, which is the one governing German universities and state research institutes"
          url: "https://www.bundesarbeitsgericht.de/entscheidung/6-azr-205-20/"
          retrieved: "2026-08-09"
          quote: "relevant professional experience for step assignment requires that the employee can take up the new activity in full immediately after hiring without appreciable induction time, and cannot be derived from a theoretical transferability of tasks"
    why: |-
      The advertisement prints a pay group as if it were an opening offer, so a candidate spends
      their leverage arguing about the salary figure — the one thing that is fixed — and never
      makes the equivalence-of-duties argument, which is the only lever that moves their pay.
  - id: "de-application-is-a-file-not-a-cv"
    text_en: |-
      A German application is a documented file, and the cover letter is part of the screen rather
      than a courtesy. The federal employment agency's own guidance for applicants describes an
      application as cover letter, CV and attachments, tells you to concentrate the letter on what
      matters for that specific advertisement rather than reusing a template, and says work references
      should ideally be supplied from every former employer, together with the qualification and
      further-training certificates relevant to the post — while also telling you to limit the
      attachments to the evidence the job actually needs, so the pack is complete rather than merely
      thick. Treat a bare CV with references "available on request" as an incomplete file by the
      standard this guidance sets, not as a normal submission.
    text_zh: |-
      在德国，一份申请是一套有据可查的材料档案，而求职信属于筛选环节的一部分，不是客套。联邦劳工局
      面向求职者的官方指引把申请材料界定为：求职信（Anschreiben）、履历（
      Lebenslauf）和附件；并要求求职信集中回应「这一则招聘广告」的具体要求，而不是套用模
      板；同时说明工作证明最好能提供每一位前雇主出具的那一份，另附与该岗位相关的学历与进修证书；但
      同一份指引也要求把附件限制在这份工作确实需要的凭证范围内——要的是「齐全」，不是「厚」。按这
      份指引的标准，一份光秃秃的履历加上一句「证明材料可另行索取」，属于材料不齐，而非常规做法。
    applies_when: "Any German application that is not routed through an employer portal which explicitly asks for a CV only."
    added: "2026-08-09"
    review_by: "2027-02-09"
    source:
      kind: "published"
      publisher: "Bundesagentur für Arbeit"
      title: "Bewerbung schreiben"
      url: "https://www.arbeitsagentur.de/arbeitslos-arbeit-finden/bewerbungstraining/bewerbung-schreiben"
      retrieved: "2026-08-09"
      quote: "Arbeitszeugnisse: Diese sollten Sie möglichst von jedem ehemaligen Arbeitgeber vorlegen. … Konzentrieren Sie sich auf das, was für die jeweilige Stellenanzeige wichtig ist."
      note: "The submission-mechanics sentence this entry used to carry is gone: it is layout, and this table is about what the market weighs."
      also:
        - publisher: "Bundesagentur für Arbeit"
          title: "Bewerbung schreiben"
          url: "https://www.arbeitsagentur.de/arbeitslos-arbeit-finden/bewerbungstraining/bewerbung-schreiben"
          retrieved: "2026-08-09"
          quote: "Weisen Sie Ihre Qualifikationen mit Zeugnissen, Zertifikaten oder Arbeitsproben nach. Beschränken Sie sich dabei auf die für den Job notwendigen Nachweise."
        - publisher: "Bundesagentur für Arbeit"
          title: "Bewerbungsunterlagen: Das gehört rein"
          url: "https://www.arbeitsagentur.de/bildung/bewerbung/bewerbungsunterlagen"
          retrieved: "2026-08-09"
          quote: "Scannen Sie Zeugnisse und Bescheinigungen ein. Bei einer Bewerbung per Post verschicken Sie keine Originale sondern Kopien."
    why: |-
      The posting says "send your application documents", which in many markets means a CV and
      nothing else. Nothing warns you that the letter is read against the advertisement point by
      point, or that missing prior references are read as a gap in the record rather than as a
      formatting choice.
  - id: "de-austrian-and-swiss-certificates-do-not-transfer"
    text_en: |-
      Do not carry the German reference playbook across the border. Austrian law entitles you,
      on request at the end of the employment, to a written service certificate covering the duration
      and the kind of the service, and it expressly prohibits entries and annotations that would
      make it harder for you to obtain a new position. So what you can demand in Austria is duration
      and kind — a performance grading is not part of the entitlement, and an Austrian certificate
      that carries none is a compliant document, not a withheld one. Switzerland runs the other
      way: you may request a certificate at any time, during the employment as well as at its end,
      covering the kind and duration of the work and also your performance and conduct, and the
      federal economics secretariat states the wording must be truthful and benevolent and expressly
      rejects ambiguous phrasing and certificate codes. Negative facts may appear in a Swiss certificate
      where they are material to the overall assessment of the employee. Match the document to
      the country you are applying in, and explain the difference rather than letting a thin Austrian
      certificate look like a bad German one.
    text_zh: |-
      不要把德国那套「工作证明」的打法直接带过边境。奥地利法律规定：雇佣关系结束时，你可以要求一份
      书面服务证明，内容为服务的时长与种类；并且明文禁止写入任何会使你更难找到新工作的记载与批注。
      因此在奥地利，你能够「要求」到的内容就是时长与种类——表现评级不在请求权范围内；一份不含评级
      的奥地利证明是合规文件，不是雇主有意扣着不给。瑞士则相反：你在雇佣期间和结束时都可以随时要求
      出具证明，内容涵盖工作的种类、时长以及你的表现与行为；瑞士联邦经济事务秘书处明确要求措辞真实
      且善意，并明文反对含糊表述和「证明暗语」。负面事实只要对雇员的整体评价具有重要性，就可以写进
      瑞士的工作证明。请按你投递的国家匹配文件；如果一份内容单薄的奥地利证明被拿到德国来看，主动解
      释这项法律差异，别让它显得像一份差评。
    applies_when: "Applying to a German employer when the work history you are presenting is Austrian or Swiss."
    added: "2026-08-09"
    review_by: "2027-08-09"
    source:
      kind: "published"
      publisher: "Rechtsinformationssystem des Bundes (RIS), Bundeskanzleramt der Republik Österreich"
      title: "Angestelltengesetz Art. 1 § 39, Bundesrecht konsolidiert"
      url: "https://www.ris.bka.gv.at/NormDokument.wxe?Abfrage=Bundesnormen&Gesetzesnummer=10008069&Artikel=1&Paragraf=39"
      retrieved: "2026-08-09"
      quote: "Der Dienstgeber ist verpflichtet, bei Beendigung des Dienstverhältnisses dem Angestellten auf Verlangen ein schriftliches Zeugnis über die Dauer und die Art der Dienstleistung auszustellen. Eintragungen und Anmerkungen im Zeugnisse, durch die dem Angestellten die Erlangung einer neuen Stelle erschwert wird, sind unzulässig."
      note: "The Austrian provision sets a minimum content and bars harmful entries; it does not bar a favourable assessment. What it establishes is that a grading is not part of what you can demand. The Swiss address is the redirect target of the one in the research."
      also:
        - publisher: "Staatssekretariat für Wirtschaft (SECO)"
          title: "FAQ zu Arbeitszeugnis"
          url: "https://www.seco.admin.ch/de/faq-arbeitszeugnis"
          retrieved: "2026-08-09"
          quote: "wahrheitsgetreue Aussagen … wohlwollende Formulierung"
        - publisher: "Staatssekretariat für Wirtschaft (SECO)"
          title: "FAQ zu Arbeitszeugnis, on material negatives"
          url: "https://www.seco.admin.ch/de/faq-arbeitszeugnis"
          retrieved: "2026-08-09"
          quote: "Negative Tatsachen dürfen im Zeugnis erwähnt werden, sofern sie für die Gesamtbeurteilung des Arbeitnehmers erheblich sind"
    why: |-
      Recruiters and candidates alike treat "DACH" as one market and reuse one document set across
      it. Nothing in a posting tells you that the certificate that is standard in one of the three
      countries is legally out of place in another, so a compliant Austrian certificate can be
      misread in Germany as a deliberately empty one.

