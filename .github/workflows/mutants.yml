# Mutation testing, on a schedule and on demand — never on every push.
#
# The suite going green is not evidence it would notice the code being wrong. On
# 2026-08-23 an audit generated 421 mutants against this repo and 98 survived,
# concentrated in render_cv.py (32/64), check_claims.py (11/26) and
# check_shortlist.py (8/46) — the renderer whose output reaches an employer and
# the two gates that decide whether a package may be delivered.
#
# This job fails only on survivors ABSENT from scripts/mutants-baseline.json, so
# the existing debt does not block anyone and new blindness does. It is separate
# from checks.yml because it takes minutes to hours: a slow job wired into every
# push is a job someone eventually deletes.
#
# One job per target file. As a single job the three files ran in series and the
# run of 2026-09-21 had spent 1h56m before reaching render_cv.py, whose 203
# mutants alone need more than the old 180-minute limit. The matrix must list
# exactly DEFAULT_TARGETS in scripts/mutants.py; test_ci.py holds them together.
name: mutants

on:
  workflow_dispatch:
  schedule:
    - cron: "0 4 * * 1"   # Mondays, 04:00 UTC

jobs:
  mutants:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        target:
          - scripts/check_apply.py
          - scripts/check_claims.py
          - scripts/render_cv.py
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      # The suite runs the node tests too; use the same Node as checks.yml, not
      # whatever the runner image happens to ship.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install -r requirements.txt pytest
      - name: mutation testing against the recorded baseline
        run: python3 scripts/mutants.py --ci --targets ${{ matrix.target }}
