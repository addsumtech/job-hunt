      quote: "用人单位招用劳动者时，应当如实告知劳动者工作内容、工作条件、工作地点、职业危害、安全生产状况、劳动报酬，以及劳动者要求了解的其他情况；用人单位有权了解劳动者与劳动合同直接相关的基本情况，劳动者应当如实说明。"
      note: "Scope: the two statutes are China-wide; the Beijing 解答 below is guidance for Beijing courts and arbitration and must not be presented as a national rule. The 劳动合同法 copy cited here is a real official republication, though npc.gov.cn would be the more canonical home."
