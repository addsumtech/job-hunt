# Market conventions — Netherlands (nl)
#
# Built 2026-08-09 from docs/superpowers/research/2026-08-09/
# markets.json + review-nl_weu.md. The research key was nl_weu; this table is the
# Netherlands half of it. Every `published` URL in that research was fetched and
# every "Verbatim:" string grepped against the fetched text on 2026-08-09.
#
# DROPPED
#   nl-weu-be-single-permit-is-regional — Belgium-only. The market keys are
#   cn/nl/de/uk/us, so an entry that can only fire on a Belgian posting can never
#   render, and leaving it invites a Dutch applicant reading Belgian
#   regional-competence advice. Every Belgian clause in the surviving entries is
#   cut for the same reason, and with them the joint-committee sentence and its
#   Federale Overheidsdienst Werkgelegenheid citation in
#   nl-sector-agreement-sets-the-band: a citation supporting a claim the card no
#   longer makes is a citation nobody can check the card against.
#
# NEXT REVIEW — from review-nl_weu.md's "Important and missing", verbatim. Do not
# write these into conventions from this comment; a person must check the source
# first.
#   1. **The orientation year permit (verified, and it breaks convention 1's frame).** `https://ind.nl/en/residence-permits/work/residence-permit-for-orientation-year`: the applicant files it themselves, and "Your employer does not need a work permit (in Dutch: *tewerkstellingsvergunning* or TWV)." For a recent graduate of an eligible programme this removes the recognised-sponsor gate entirely and widens the employer pool. The entry's `unverified` list does not mention it either — it is not a known gap, it is an unknown one.
#
#   2. **The expat scheme's announced reduction.** Covered in convention 3 above. Independently of the constraint problem, an entry that teaches a candidate to evaluate net pay must not silently fix the percentage in the scheme's name during the year before it changes.
#
#   3. **College oordelen are not legally binding.** Verified verbatim. The SOURCE-QUALITY NOTE lists NVP and EURES as non-statutory and lists seven sources as official/statutory — and leaves the College out of both lists, so the one source whose status most affects how a candidate acts is the one with no label.
#
#   4. **The EU Blue Card.** `unverified` item 9 correctly refuses to describe it from memory. But its absence means a candidate whose salary clears one route's criterion and not the other's has no way to know a second route exists. Research it or state its existence and stop there — the current silence reads as "the highly skilled migrant route is the route".
#
#   5. **NVP clause 5.3 — what happens to your data after rejection.** "Voor zover van toepassing worden gegevens afkomstig van een sollicitant binnen vier weken na de afwijzing teruggezonden of vernietigd, tenzij expliciet anders met de sollicitant is overeengekomen", with a re-consent step after a year for retained data and a destruction duty for agencies once mediation ends. This is candidate-facing, concrete, in a source already fetched, and absent from both `application_artifacts` and `interview_shape`.
#
#   6. **NVP clause 3.2 — you may ask for a deviation.** Where an organisation uses internet or video applications, or confronts you with other candidates, "mag de sollicitant in het kader van de vertrouwelijkheid om afwijking van de procedure verzoeken." A candidate who does not know a one-way video interview is refusable-with-a-reason cannot exercise it. `interview_shape` covers 3.4 (algorithmic pre-selection) but skips 3.2.
#
#   7. **NVP clause 2.6 — how to read an age limit or preference policy in a Dutch posting.** Only permitted where legally allowed, and then "wordt daarvan uitdrukkelijk melding gemaakt in de vacature en wordt de reden daarvan aangegeven". Useful for reading postings; note it names a protected trait, so the shipper must decide whether the constraint blocks it.


market: nl

conventions:
  - id: "nl-recognised-sponsor-gate"
    text_en: |-
      For many Netherlands roles that need a work-related residence permit, the deciding factor
      is the employer, not you. Under the highly skilled migrant (kennismigrant) scheme the IND
      says: "Only an employer recognised by the IND can apply for your permit" — the employer files
      it, and you cannot file it yourself. IND publishes a public register of recognised sponsors
      that anyone can search, listing organisations by name and Chamber of Commerce number. Check
      the company in that register before you invest in a tailored application; if it is not listed,
      ask the recruiter at the earliest contact whether they sponsor, because a posting often says
      nothing either way. Not every route works like this — the IND orientation year permit for
      graduates of eligible programmes is one you apply for yourself, and during it your employer
      needs no work permit — so establish which route applies to you before assuming the sponsor
      gate is the only one. Treat sponsor status as a fact about what the employer is set up to
      do administratively, not as a fact about you.
    text_zh: |-
      荷兰不少需要工作居留许可的岗位，决定权在雇主而不在你。在"高技能移民"(kennismigrant) 路
      径下，IND 明确写着：只有被 IND 认定为"认可担保方"(recognised sponsor) 的
      雇主才能提交该许可申请——由雇主提交，你自己无法申请。IND 有一份公开的认可担保方名录，任
      何人都能查，按公司名和商会注册号列出。投递前先在名录里查这家公司；查不到就尽早直接问对方是否
      办理担保，因为招聘广告常常两边都不写。但并非所有路径都如此——面向符合条件项目毕业生的 IND"找
      工作年"(orientation year) 许可由你本人申请，持有期间雇主无需办理工作许可
      ——所以先确认自己适用哪条路径，再判断雇主门槛是否是唯一门槛。担保资质是关于雇主具备什么行政
      能力的事实，不是关于你本人的判断。
    applies_when: "Applying to a Netherlands-based role that would require a Dutch residence permit for work."
    added: "2026-08-09"
    review_by: "2027-02-09"
    source:
      kind: "published"
      publisher: "IND (Immigratie- en Naturalisatiedienst)"
      title: "Highly skilled migrant"
      url: "https://ind.nl/en/residence-permits/work/highly-skilled-migrant"
      retrieved: "2026-08-09"
      quote: "Only an employer recognised by the IND can apply for your permit."
      note: "The register sentence belongs to the Work register page; the landing page words it differently, so it is cited here and not there."
      also:
        - publisher: "IND (Immigratie- en Naturalisatiedienst)"
          title: "National highly skilled migrant scheme"
          url: "https://ind.nl/en/about-us/background-articles/national-highly-skilled-migrant-scheme"
          retrieved: "2026-08-09"
          quote: "The future employer does this for the highly skilled migrant. Only companies recognised by the IND can submit such an application."
        - publisher: "IND (Immigratie- en Naturalisatiedienst)"
          title: "Public register Work"
          url: "https://ind.nl/en/public-register-recognised-sponsors/public-register-regular-labour-and-highly-skilled-migrants"
          retrieved: "2026-08-09"
          quote: "You can use this register to check if the organisation has been recognised by the IND as a sponsor; The public registers are updated once a month."
        - publisher: "IND (Immigratie- en Naturalisatiedienst)"
          title: "Residence permit for orientation year"
          url: "https://ind.nl/en/residence-permits/work/residence-permit-for-orientation-year"
          retrieved: "2026-08-09"
          quote: "Your employer does not need a work permit (in Dutch: tewerkstellingsvergunning or TWV)."
    why: |-
      Postings advertise the job, not the company's immigration administration. A company that
      is not a recognised sponsor can post an identical vacancy to one that is, and the difference
      only surfaces after you have written the letter — or after a first interview. The register
      exists and is public, but nothing in the posting points to it.
  - id: "nl-salary-criterion-reset-annually"
    text_en: |-
      The highly skilled migrant route carries a salary criterion published by the IND, and the
      amounts change annually. The amount that counts is the one in force on the date the application
      is filed; when someone moves to a new employer it is the amount in force on the date the
      new contract starts. A second test sits alongside the amount: the IND also requires that
      "The agreed salary is in line with the market rate", which it defines as earning the same
      as what people in the same job earn on average. So the posted salary band is not only a pay
      question, it is part of whether the permit application can succeed at all — and a posting
      can be entirely genuine while its band sits under the criterion for that route. Look up the
      current figure on the IND "Required amounts income requirements" page before you negotiate,
      rather than relying on a figure someone quoted last year.
    text_zh: |-
      高技能移民路径有一条由 IND 公布的工资门槛，数额每年调整。起作用的是"提交申请当天"生效
      的那个数额；换雇主时则是新合同生效日的数额。除数额之外还有第二道检验：IND 同时要求"约定
      薪资须符合市场行情"，其定义是你的薪资与从事同一工作的人的平均水平相当。因此招聘上写的薪资区
      间不只是钱的问题，它直接关系到许可申请能否成立——一个岗位可以完全真实，而它的薪资区间却够不
      到该路径的门槛。谈薪之前，请到 IND 的 "Required amounts income
      requirements" 页面查当年的数额，不要沿用别人去年报的数字。
    applies_when: "Any Netherlands role where the highly skilled migrant route would be used, and at every salary-negotiation step within it."
    added: "2026-08-09"
    review_by: "2027-02-05"
    source:
      kind: "published"
      publisher: "IND (Immigratie- en Naturalisatiedienst)"
      title: "Required amounts income requirements"
      url: "https://ind.nl/en/required-amounts-income-requirements"
      retrieved: "2026-09-05"
      quote: "The required amounts change every year on January 1"
      also:
        - publisher: "IND (Immigratie- en Naturalisatiedienst)"
          title: "Required amounts income requirements"
          url: "https://ind.nl/en/required-amounts-income-requirements"
          retrieved: "2026-09-05"
          quote: "The highly skilled migrant must meet the required amount that applies on the date of the application; The highly skilled migrant must then meet the required amount applicable on the date on which the employment contract with the new employer commences."
        - publisher: "IND (Immigratie- en Naturalisatiedienst)"
          title: "Highly skilled migrant"
          url: "https://ind.nl/en/residence-permits/work/highly-skilled-migrant"
          retrieved: "2026-09-05"
          quote: "The agreed salary is in line with the market rate. In line with the market rate means that you earn the same as what people in the same job earn on average."
          note: "Re-checked on the review date: this sentence is on the highly skilled migrant conditions page, NOT on the required-amounts page it was cited to. The claim was true and its citation was wrong, which is the failure a review is for."
    why: |-
      The posting states a band, not the statutory criterion the band has to clear, and the criterion
      moves each year. Candidates negotiate as if only the employer's willingness matters, and
      discover the interaction with the permit only when the offer is drafted — or when an internal
      move to a new employer resets the test.
  - id: "nl-expat-scheme-is-an-employer-filing"
    text_en: |-
      The tax break widely known by an old percentage nickname is administered by the Belastingdienst
      under the name expatregeling, and it is not a benefit you claim on arrival. You and the employer
      complete the request together, and it applies only once the Belastingdienst has issued a
      decision (beschikking). That decision runs for a capped term, the employer must keep re-testing
      the income norm while it runs, and moving to a new employer means the new employer and the
      employee must file a fresh joint request. There is also a prior-residence condition attached
      to the scheme's definition of an incoming employee, so not every internationally recruited
      hire qualifies. The exempt percentage and the income thresholds are set per year, and a reduction
      in the percentage together with a rise in the income norm is scheduled for the start of a
      coming calendar year — but not yet final: it takes effect only if it passes both Houses. So
      a rate quoted from an older source can already be wrong, and one quoted from the announcement
      is not yet law. Read any net-pay figure quoted "with the expat ruling" as conditional until the decision
      exists, ask whether this employer routinely files it, and check the Belastingdienst page
      for the year your contract would start.
    text_zh: |-
      通常被以旧的百分比昵称称呼的这项税收优惠，荷兰税务局以 expatregeling（来荷雇员
      优惠）之名管理，它不是你入职后自己去领的福利。必须由你和雇主共同填写申请，并且只有在税务局下
      发正式决定 (beschikking) 之后才能适用。该决定有最长期限，期间雇主还要持续核验
      收入门槛；换雇主时，新雇主要和你重新共同提出申请。此外，该制度对"来荷雇员"的定义还附带入职
      前居住地条件，因此并非所有从境外招聘的人都符合。免税比例和收入门槛按年度设定；已宣布下调比例
      并同时上调收入门槛，自某个未来自然年年初起算，但尚未最终确定——须先通过参众两院才生效。
      所以从旧资料里抄来的比例可能已经不对，而从公告里抄来的也还不是法律。雇主报出的"含该优惠"的税后数字，在决定
      书下来之前都只是条件性的；面试时可以直接问这家雇主是否惯例办理，并按你实际入职的年度到税务局
      页面核对当年的比例和门槛。
    applies_when: "Whenever a Netherlands offer is discussed in net-pay terms, or an employer mentions the expat ruling as part of the package."
    added: "2026-08-09"
    review_by: "2027-02-05"
    source:
      kind: "published"
      publisher: "Belastingdienst"
      title: "Voorwaarden voor de expatregeling"
      url: "https://www.belastingdienst.nl/wps/wcm/connect/bldcontentnl/belastingdienst/zakelijk/internationaal/personeel/u_bent_niet_in_nederland_gevestigd_loonheffingen_inhouden/als_u_loonheffingen_gaat_inhouden/extraterritoriale_kosten_en_de_30procentregeling/voorwaarden_voor_de_30procentregeling1/voorwaarden_voor_de_30procentregeling"
      retrieved: "2026-08-09"
      quote: "Wij hebben een beschikking afgegeven waaruit blijkt dat u van de expatregeling gebruik kunt maken."
      note: "The exempt share and the income thresholds sit on the pages cited here and are deliberately not reproduced in the entry: they are set per year, an announced reduction is not yet final, and a figure copied into this table could not be kept current."
      also:
        - publisher: "Belastingdienst"
          title: "Kan ik de expatregeling aanvragen als ik in Nederland kom werken?"
          url: "https://www.belastingdienst.nl/wps/wcm/connect/nl/wonen-of-werken-buiten-nederland/content/ik-kom-in-nederland-werken-30-procent-regeling-aanvragen"
          retrieved: "2026-08-09"
          quote: "Voldoet u aan alle voorwaarden, vul het aanvraagformulier dan samen met uw werkgever in."
        - publisher: "Belastingdienst"
          title: "Beschikking: geldigheid en toetsen voorwaarden"
          url: "https://www.belastingdienst.nl/wps/wcm/connect/bldcontentnl/belastingdienst/zakelijk/internationaal/personeel/u_bent_niet_in_nederland_gevestigd_loonheffingen_inhouden/als_u_loonheffingen_gaat_inhouden/extraterritoriale_kosten_en_de_30procentregeling/voorwaarden_voor_de_30procentregeling1/beschikking_geldigheid_en_toetsen_voorwaarden"
          retrieved: "2026-08-09"
          quote: "De nieuwe werkgever moet dan samen met de werknemer een nieuw verzoek indienen; U moet tijdens de looptijd van de beschikking toetsen of de werknemer nog aan de inkomensnorm voldoet."
        - publisher: "Belastingdienst"
          title: "Definitie ingekomen werknemer"
          url: "https://www.belastingdienst.nl/wps/wcm/connect/bldcontentnl/belastingdienst/zakelijk/internationaal/personeel/u_bent_niet_in_nederland_gevestigd_loonheffingen_inhouden/als_u_loonheffingen_gaat_inhouden/extraterritoriale_kosten_en_de_30procentregeling/voorwaarden_voor_de_30procentregeling1/definitie_ingekomen_werknemer"
          retrieved: "2026-08-09"
        - publisher: "Business.gov.nl (Netherlands government information for entrepreneurs)"
          title: "30% ruling: compensation for expats down to 27%"
          url: "https://business.gov.nl/amendments/30-percent-ruling-compensation-down-to-27-percent/"
          retrieved: "2026-08-09"
          retrieved: "2026-09-05"
          quote: "From 1 January 2027 you may pay your employee a maximum of 27% of their wages tax-free.; The effective date of this measure is not yet final. Entry into force is subject to its passing through the Lower and Upper Houses."
    why: |-
      Recruiters quote take-home pay "with the expat ruling" as if it were automatic, and the scheme
      has been renamed and repeatedly amended, so second-hand descriptions go stale fast. Nothing
      in a posting says whether the employer files these requests as a matter of course, whether
      a prior period in the Netherlands affects eligibility, or that a later job change restarts
      the process.
  - id: "nl-sector-agreement-sets-the-band"
    text_en: |-
      The salary band may not be the employer's to move. In the Netherlands a collective labour
      agreement (CAO) can fix pay and other terms for the role, and where the CAO and the individual
      employment contract contradict each other, the CAO prevails. An employer can be bound to
      a sector CAO without belonging to the employers' organisation that negotiated it, because
      the Ministry of Social Affairs and Employment can declare a CAO generally binding for the
      sector (algemeen verbindend verklaard, AVV). Find out which CAO covers the job, and read
      the scale, before you name a number — then ask the employer directly which parts of the package
      it still controls.
    text_zh: |-
      薪资区间未必由雇主说了算。在荷兰，集体劳动协议 (CAO) 可以规定该岗位的工资和其他条件；
      当 CAO 与个人劳动合同冲突时，以 CAO 为准。即使雇主不是签订该 CAO 的雇主协会成
      员，社会事务与就业部也可以宣布该 CAO 对整个行业"普遍适用"(algemeen verbindend
      verklaard, AVV)，雇主同样必须执行。报价之前先弄清这份工作归哪个 CAO、并读
      一下工资表，然后直接问雇主：待遇里还有哪些部分是他们能决定的。
    applies_when: "Before any salary discussion for a Netherlands role. Whether a CAO covers the job is checkable per employer and sector through the government lookups cited below — check, rather than inferring from the sector."
    added: "2026-08-09"
    review_by: "2027-02-09"
    source:
      kind: "published"
      publisher: "Business.gov.nl (Netherlands government information for entrepreneurs)"
      title: "CAO: Collective Labour Agreement"
      url: "https://business.gov.nl/regulations/cao/"
      retrieved: "2026-08-09"
      quote: "If the CAO and an employment contract contradict each other, the CAO prevails"
      also:
        - publisher: "Business.gov.nl (Netherlands government information for entrepreneurs)"
          title: "CAO: Collective Labour Agreement"
          url: "https://business.gov.nl/regulations/cao/"
          retrieved: "2026-08-09"
          quote: "algemeen verbindend verklaard, AVV"
    why: |-
      A posting says "competitive salary" or gives a band; it does not say that a sector-wide agreement,
      possibly extended to the employer by ministerial decree, already sets the scale and overrides
      the contract. Candidates then negotiate hard against a number nobody in the room is allowed
      to change, and miss the negotiation that is actually available: which scale and which step.
  - id: "nl-motivation-letter-is-scored"
    text_en: |-
      For qualified and highly qualified positions the letter is a selection instrument, not a
      cover note. EURES's Netherlands guidance says that for jobs at a qualified and highly qualified
      level an application letter with a CV is the standard procedure, that motivation is one of
      the most important selection criteria for Dutch employers, and that the letter should set
      out why you are applying, then why you are suitable and motivated, then ask for an interview.
      It also says the letter is expected in Dutch unless the employer indicates otherwise, that
      unsolicited applications are very common, and that it is not uncommon to phone a company
      beforehand provided you have prepared clear questions first. Write to that structure and
      to this employer, rather than reusing the same letter across employers.
    text_zh: |-
      对中高级岗位而言，求职信是选拔工具，不是附言。欧盟 EURES 的荷兰指南写明：中高级岗位的
      标准投递方式是求职信＋简历；动机是荷兰雇主最重要的筛选标准之一；信里应先说明你为什么应聘，再
      说明你为什么合适、为什么有动力，最后请求面谈。指南还说明：除非雇主另有说明，求职信默认用荷兰
      语写；主动投递（未招聘岗位的自荐）在荷兰非常普遍；事先打电话给公司也不算稀奇，前提是你先准备
      好了明确的问题。请照这个结构、针对这家雇主来写，而不是把同样的信重复投给多家。
    applies_when: "Any qualified or highly qualified application in the Netherlands."
    added: "2026-08-09"
    review_by: "2027-02-09"
    source:
      kind: "published"
      publisher: "EURES (EURopean Employment Services, European Commission)"
      title: "Living and working conditions: Netherlands"
      url: "https://eures.europa.eu/living-and-working/living-and-working-conditions/living-and-working-conditions-netherlands_en"
      retrieved: "2026-08-09"
      quote: "it is not uncommon to phone a company beforehand; however, make sure you have first prepared a number of clear questions"
      note: "EURES country guidance is descriptive European Commission material about customary practice, not a legal rule."
      also:
        - publisher: "EURES (EURopean Employment Services, European Commission)"
          title: "Living and working conditions: Netherlands"
          url: "https://eures.europa.eu/living-and-working/living-and-working-conditions/living-and-working-conditions-netherlands_en"
          retrieved: "2026-08-09"
          quote: "for jobs at a qualified and highly qualified level, an application letter with a CV is the standard procedure"
        - publisher: "EURES (EURopean Employment Services, European Commission)"
          title: "Living and working conditions: Netherlands"
          url: "https://eures.europa.eu/living-and-working/living-and-working-conditions/living-and-working-conditions-netherlands_en"
          retrieved: "2026-08-09"
          quote: "motivation is one of the most important selection criteria for Dutch employers"
        - publisher: "EURES (EURopean Employment Services, European Commission)"
          title: "Living and working conditions: Netherlands"
          url: "https://eures.europa.eu/living-and-working/living-and-working-conditions/living-and-working-conditions-netherlands_en"
          retrieved: "2026-08-09"
          quote: "Unsolicited ('on-spec') job applications are very common in the Netherlands"
    why: |-
      Postings say "send your CV and a short motivation", which reads like a formality in markets
      where the CV carries the decision. It does not say that the letter is weighted as a primary
      criterion, that a Dutch-language letter is the default unless stated otherwise, or that calling
      ahead is culturally acceptable rather than pushy.
  - id: "nl-language-requirement-must-be-justified"
    text_en: |-
      A language requirement in a Dutch vacancy can be challenged, which makes it a fair thing
      to ask about. The Netherlands Institute for Human Rights examined a vacancy for a lecturer
      post that demanded excellent communication skills in both Dutch and English. It applied the
      test that indirect discrimination is not prohibited where it is objectively justified by
      a legitimate aim and the means of achieving it are appropriate and necessary; it accepted
      the employer's aim as legitimate, and still found that demanding excellent proficiency in
      both languages was not necessary for that role. Its opinions are authoritative but not legally
      binding, and that opinion does not tell you how any other employer means its language line.
      So ask early which specific parts of the work run in Dutch — customers, colleagues, suppliers,
      documentation — instead of guessing whether the line is decorative or disqualifying.
    text_zh: |-
      荷兰招聘广告里的语言要求是可以被质疑的，所以直接问它是合理的。荷兰人权研究所曾审查一则高校讲
      师岗位的招聘广告，其要求"荷兰语和英语都具备出色沟通能力"。研究所适用的检验标准是：间接区别
      对待若具备正当目的、且实现该目的的手段适当且必要，则不被禁止；它认可雇主的目的正当，但仍认定
      "两种语言都要出色"对该岗位并非必要。该机构的裁定具有权威性但不具法律约束力，而且这一份裁定
      并不能告诉你其他雇主的语言要求是什么意思。所以请尽早直接问：这份工作具体哪些部分要用荷兰语——客
      户、同事、供应商，还是文档——而不是去猜那行字是摆设还是硬门槛。
    applies_when: "Any Netherlands posting that mentions Dutch, whether as a requirement or as a preference."
    added: "2026-08-09"
    review_by: "2027-02-09"
    source:
