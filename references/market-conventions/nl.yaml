    why: |-
      Postings never describe the screening step. Candidates either volunteer referees far too
      early, or assume — from markets where quiet back-channel checks are routine — that a current
      employer may be contacted without warning, and so avoid applying while employed.
  - id: "nl-pay-range-not-pay-history"
    text_en: |-
      Pay history is not supposed to be the anchor here. The NVP Sollicitatiecode states as a founding
      principle that no payslip from a current or previous employer may be demanded of an applicant.
      On the EU layer, the EU pay-transparency directive gives applicants a right to receive from
      the prospective employer the initial pay or its range for the position, based on objective,
      gender-neutral criteria, together with the relevant provisions of any applicable collective
      agreement, and provides that an employer shall not ask applicants about their pay history.
      That right reaches you through national implementing law, and implementation is uneven across
      member states — the directive's transposition deadline had already passed while the Dutch
      implementing bill was still before the Tweede Kamer, so check the current national position
      rather than assuming the right is in force. Practically: ask for the range and the applicable
      collective-agreement scale, and treat a payslip request as something you may decline.
    text_zh: |-
      在这里，过往薪资不应成为定价锚点。荷兰招聘行为准则 NVP Sollicitatiecode 在
      其基本原则中明确规定：不得要求求职者提供现任或前任雇主的工资单。在欧盟层面，欧盟薪酬透明指令 赋
      予求职者向潜在雇主索取该岗位起薪或薪资区间（依据客观、性别中立的标准）以及适用集体协议相关条
      款的权利，并规定雇主不得询问求职者的薪资历史。该权利需通过各国国内立法落地，而各成员国进度不
      一——该指令的转化期限已过，而荷兰的实施法案当时仍在众议院 (Tweede Kamer) 审
      议，因此请核对当下的国内法状态，不要假定该权利已生效。实务上：主动索要薪资区间和适用的集体协
      议工资级别；被要求提供工资单时，你可以拒绝。
    applies_when: "At first recruiter contact and at every pay discussion in the Netherlands. The payslip rule is a Netherlands-specific self-regulatory norm; the EU directive layer applies across EU member states via national implementing law — do not assume it for non-EU EEA states without checking."
    added: "2026-08-09"
    review_by: "2027-01-15"
    protected_trait_note: "The quoted right requires the initial pay or its range to rest on objective, gender-neutral criteria. The trait names the standard the EMPLOYER's criteria must meet inside a quoted legal test, not an attribute of the reader; dropping it would misquote the very right this entry exists to point at."
