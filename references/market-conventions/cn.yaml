        - publisher: "上海市人民政府门户网站"
          title: "《关于做好2025年非上海生源应届普通高校毕业生进沪就业工作的通知》（沪教委学〔2025〕15号）"
          url: "https://www.shanghai.gov.cn/gwk/search/content/9183a0b0d5664cc189937b5178e9711e"
