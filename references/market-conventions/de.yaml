  - note: "Whether the Anschreiben is universally expected. The Bundesagentur für Arbeit treats it as standard, and the entry is written on that basis. I found no source on how many German employers, particularly international technology employers, now waive it. Do not upgrade \"standard component\" into \"always required\"."
