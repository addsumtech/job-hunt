  - note: "One narrowing on an entry that IS sourced, so the limit is visible. The at-will entry cites the California Division of Labor Standards Enforcement's statement of the doctrine. At-will is state law, not a federal statute; I could not retrieve dol.gov or a second state's page (both returned HTTP 403). The doctrine is the near-universal US default, but this entry is sourced to one state's official statement of it, and the entry's source_detail says so. Montana is the commonly cited exception; I did not verify that and have not claimed it."
    disclaims: [us-at-will-is-the-default]
