          quote: "用人单位在与高校毕业生签订就业协议时…应如实告知本单位是否具备为非上海生源毕业生申请本市户籍的资格"
    why: |-
      Postings either omit 落户 or say 协助办理, which conceals that the filing is the employer's to
      make and that the employer must itself qualify to make it. Candidates discover the gap after
      accepting.
  - id: "cn-internship-is-usually-not-an-employment-relationship"
    text_en: |-
      An 实习 posting can read exactly like a job ad, but for a student still enrolled it generally
      does not create an employment relationship: what you sign is an internship agreement rather
      than a 劳动合同, and the protections attaching to employment do not automatically attach to it.
      Courts look at substance, so an arrangement labelled 实习 that is really employment can be
      found to be employment — but do not assume the label carries employment terms with it. Read
      what the agreement itself provides on pay, hours and termination, because the statute will
      not fill those gaps for you the way it does inside a 劳动合同.
    text_zh: |-
      实习岗位的招聘信息看起来和正式工作一模一样，但对仍在校的学生而言，一般不构成劳动关系：你签的
      是实习协议而非劳动合同，劳动关系项下的保护不会自动适用。司法上看实质，名为实习实为用工的也可
      能被认定为劳动关系——但不要默认「实习」两个字自带劳动合同待遇。要逐条看协议本身怎么约定报酬
      、工时和解除，因为这些空白不会像劳动合同那样由法律替你补上。
    applies_when: "Any posting labelled 实习 / 实习生 taken while you are still enrolled at a school."
    added: "2026-08-09"
    review_by: "2027-08-09"
    source:
      kind: "published"
      publisher: "工人日报, republished by 新华网"
      title: "签了实习协议，算不算劳动关系？"
      url: "https://app.xinhuanet.com/news/article.html?articleId=1bacdef591a5718590029be878f7f3d0"
      retrieved: "2026-08-09"
      quote: "司法实践中，在校学生进入用人单位实习能否认定劳动关系，应当根据具体事实判断"
      note: "Precision: the statutory sentence the article quotes covers spare-time 勤工助学, which is narrower than 实习 generally; the broad proposition rests on lawyer and judge commentary plus two contrasting court outcomes, not on that sentence. This is state-media reporting of an underlying labour-administration opinion, not the primary instrument, so the reporting is what is being stood behind. The same article notes a host still owes safety obligations, so the floor is not zero — it is simply not the 劳动合同 one."
      also:
        - publisher: "工人日报, republished by 新华网"
          title: "签了实习协议，算不算劳动关系？"
          url: "https://app.xinhuanet.com/news/article.html?articleId=1bacdef591a5718590029be878f7f3d0"
          retrieved: "2026-08-09"
          quote: "在校生利用业余时间勤工助学，不视为就业，未建立劳动关系"
    why: |-
      The posting advertises pay and hours in the same format as a permanent role and gives no
      signal that the legal frame around it is different and thinner.

