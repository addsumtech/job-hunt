    why: |-
      A posting gives the language line and no reasoning behind it, so candidates either self-reject
      on a preference or over-invest in convincing an employer that a hard requirement is negotiable.
      That there is a published legal standard the requirement has to meet — and therefore a fair,
      specific question to ask about it — is invisible from the posting.
  - id: "nl-references-only-with-prior-permission"
    text_en: |-
      References are taken with your prior permission, not quietly in the background. The NVP Sollicitatiecode
      — the Dutch recruitment code of conduct, drawn up in consultation with the Stichting van
      de Arbeid — provides that where a reference is requested from third parties, or further investigation
      is necessary, the organisation must ask the applicant for permission in advance, unless permission
      is not required by law or further regulation. The same code says a mandatory background check,
      where it applies, belongs in the recruitment profile the organisation draws up for the role,
      and that information obtained via the internet or social media must, if relevant, be discussed
      with you with the source explicitly named and with an opportunity to respond. So line up
      referees before you need them, expect to be asked, and remember the permission is yours to
      give — you can withhold it for a current employer. The code is a self-regulatory code of
      conduct with its own complaints body, not a statute: it sets a norm, not an enforceable right.
    text_zh: |-
      向第三方索取推荐意见必须事先得到你的同意，不会在背后悄悄做。荷兰招聘行为准则 NVP Sollicitatiecode（
      与劳动基金会 Stichting van de Arbeid 协商制定）规定：向第三方索取推
      荐意见、或需要进一步调查时，必须事先征得求职者同意——除非法律或相关法规规定无需征得同意。同
      一准则还规定：若该岗位存在强制性的背景调查，应写入招聘方为该岗位制定的招聘画像 (wervingsprofiel)；
      通过互联网或社交媒体获得的信息，如与岗位相关，必须注明来源与你讨论，并给你回应的机会。所以：
      提前备好推荐人，预期会被征询；同意权在你手上，你可以不同意联系现任雇主。请注意该准则是带投诉
      机构的行业自律准则，不是法律：它确立的是规范，不是可强制执行的权利。
    applies_when: "From the point an application reaches later interview rounds in the Netherlands, and whenever an employer or agency asks for referee details."
    added: "2026-08-09"
    review_by: "2027-08-09"
