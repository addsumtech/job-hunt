      title: "Zeugnisbewertung für ausländische Hochschulabschlüsse"
      url: "https://zab.kmk.org/de/zeugnisbewertung"
      retrieved: "2026-08-09"
      quote: "Viele Arbeitgebende verlangen eine Zeugnisbewertung als Voraussetzung für die Bewerbung – zum Beispiel im öffentlichen Dienst"
      note: "The word \"voluntary\" is not on the cited page and is not carried here; what the page says is that many employers require the document, the public service among them."
      also:
        - publisher: "Zentralstelle für ausländisches Bildungswesen (ZAB)"
          title: "Zeugnisbewertung für ausländische Hochschulabschlüsse"
          url: "https://zab.kmk.org/de/zeugnisbewertung"
          retrieved: "2026-08-09"
          quote: "sie berechtigt aber nicht zur Studienzulassung, zu weiterführenden Studien oder zum Arbeiten in einem reglementierten Beruf"
        - publisher: "anabin (Kultusministerkonferenz)"
          title: "Rechercheanleitung: Bewertung Hochschulabschluss"
          url: "https://anabin.kmk.org/rechercheanleitung-hochschulabschluss"
          retrieved: "2026-08-09"
          quote: "Weitere Informationen zum Status finden Sie mit Klick auf den Status (H+, H+/-, H-)"
        - publisher: "anabin (Kultusministerkonferenz)"
          title: "Rechercheanleitung: Bewertung Hochschulabschluss"
          url: "https://anabin.kmk.org/rechercheanleitung-hochschulabschluss"
          retrieved: "2026-08-09"
          quote: "Die anabin-Datenbank erhebt keinen Anspruch auf Vollständigkeit. Daher kann es vorkommen, dass Ihr Abschluss/Abschlusstyp in anabin noch nicht aufgeführt oder bewertet ist."
    why: |-
      Postings say "abgeschlossenes Hochschulstudium" and stop there. Nothing in the advertisement
      tells you that a separate federal-states agency classifies the degree, that public employers
      screen on that document before a human reads your file, or that a regulated role needs a
      further step on top of it.
  - id: "de-employer-drives-the-permit-not-you"
    text_en: |-
      Germany has no employer sponsor licence to look up, so the thing to establish is whether
      an employer is actually set up to run the procedure. Statute provides an accelerated skilled-worker
      procedure, for the skilled-worker and study-related residence purposes the provision lists,
      that the EMPLOYER applies for at the competent immigration authority under a power of attorney,
      on the basis of a written agreement between employer and authority: the employer supplies
      the documents, is obliged to keep the worker cooperating, and the authority initiates the
      comparability check of the qualification. The Blue Card EU is a named route in the residence
      statute; its minimum salary carries a threshold defined as a share of the annual pension-insurance
      contribution assessment ceiling, and the federal interior ministry announces the figures
      for each calendar year in the Federal Gazette. Look the current figure up there rather than
      trusting a number quoted in an advertisement or a blog, and ask HR who owns this procedure
      internally.
    text_zh: |-
      德国没有英美式的「雇主担保牌照」可查，所以真正要确认的是：这家雇主是否具备实际跑流程的能力。
      法律设有「加速技术工人程序」，由雇主凭授权书向主管外国人管理局提出申请，并与该机关签订书面协
      议：雇主负责提交材料、有义务督促求职者履行配合义务，机关则启动学历等值核查。欧盟蓝卡是居留法
      中的一条具名路径，其最低薪资门槛按法定养老保险年度缴费上限的一定比例确定，联邦内政部每个日历
      年在《联邦公报》上公布具体数额。请以那里的现行数额为准，不要采信招聘广告或博客里引用的数字；
      同时向 HR 问清楚公司内部由谁负责这套流程。
    applies_when: "Whenever the start of the role depends on a residence title being issued — frame the question as what this employer is set up to do, and ask before you invest in later rounds."
    added: "2026-08-09"
    review_by: "2026-11-09"
    source:
      kind: "published"
      publisher: "Bundesministerium der Justiz / juris"
      title: "§ 81a AufenthG - Einzelnorm (Aufenthaltsgesetz)"
      url: "https://www.gesetze-im-internet.de/aufenthg_2004/__81a.html"
      retrieved: "2026-08-09"
      quote: "in Vollmacht des Ausländers … Verpflichtung des Arbeitgebers, auf die Einhaltung der Mitwirkungspflicht des Ausländers … hinzuwirken"
      note: "The accelerated procedure is available only for the residence purposes the provision enumerates, and it runs on an agreement between the employer and the authority, so an employer that has none cannot simply opt in late. The salary figures are re-announced every calendar year, which is why none is printed here."
      also:
        - publisher: "Bundesministerium der Justiz / juris"
          title: "§ 18g AufenthG - Einzelnorm"
          url: "https://www.gesetze-im-internet.de/aufenthg_2004/__18g.html"
          retrieved: "2026-08-09"
          quote: "Das Bundesministerium des Innern und für Heimat gibt die Mindestgehälter … für jedes Kalenderjahr … im Bundesanzeiger bekannt."
    why: |-
      Advertisements say "we support relocation" or say nothing. Nothing tells you that the fast-track
      route is something the employer files rather than something you file, or that the salary
      threshold is re-set every year by ministry announcement — so candidates negotiate against
      a stale figure and discover the gap after the offer.
  - id: "de-works-council-must-consent-to-the-hire"
    text_en: |-
      In companies above the statutory size threshold, an employer must inform the works council
      before hiring you, hand over the application documents, disclose the intended post and its
      pay classification, and obtain the council's consent. The council may withhold consent on
      listed statutory grounds — including that a required internal posting was skipped, or that
      the hire would disadvantage existing staff. That has practical consequences: an offer can
      sit between the verbal yes and the signed contract for reasons that have nothing to do with
      you, and your file is seen by people outside HR — who are bound by a statutory duty of confidentiality
      over what they read. The council's window to object in writing is short, and consent counts
      as given if it lets that window pass, so this stage does not explain a long silence on its
      own. Do not read a gap as a rejection; ask where in the process it is.
    text_zh: |-
      在员工人数超过法定门槛的企业里，雇主录用你之前必须先通知职工委员会（Betriebsrat）
      ：提交你的申请材料、说明拟聘岗位及其薪酬定级，并取得职工委员会的同意。职工委员会可以基于法律
      列举的理由拒绝同意——例如公司跳过了应做的内部招聘公告，或该录用会使现有员工受到不利影响。这
      带来的实际后果是：口头确认到合同签署之间，offer 可能因为与你完全无关的原因卡住；你的材
      料也会被 HR 之外的人看到——而这些人依法负有保密义务。职工委员会书面提出异议的期限很短，
      逾期未提即视为同意，所以单靠这一环节并不足以解释长时间的杳无音信。不要把沉默当成婉拒，直接问
      流程走到哪一步了。
    applies_when: "Applying to a German company or public body that has a works council or staff council — common in larger and long-established employers, but not automatic above the size threshold, so treat it as a possibility rather than a certainty."
    added: "2026-08-09"
    review_by: "2027-08-09"
    source:
      kind: "published"
      publisher: "Bundesministerium der Justiz / juris"
      title: "§ 99 BetrVG - Einzelnorm (Betriebsverfassungsgesetz)"
      url: "https://www.gesetze-im-internet.de/betrvg/__99.html"
      retrieved: "2026-08-09"
      quote: "den in Aussicht genommenen Arbeitsplatz und die vorgesehene Eingruppierung mitzuteilen"
      note: "A works council is elected on employee initiative rather than mandated by size, so the size threshold in the provision does not establish that one exists at any given employer."
      also:
        - publisher: "Bundesministerium der Justiz / juris"
          title: "§ 99 BetrVG - Einzelnorm, refusal grounds"
          url: "https://www.gesetze-im-internet.de/betrvg/__99.html"
          retrieved: "2026-08-09"
