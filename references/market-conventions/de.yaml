# Market conventions — Germany (de)
#
# Built 2026-08-09 from docs/superpowers/research/2026-08-09/
# markets.json + review-de.md. Every `published` URL in that research was fetched
# and every "Verbatim:" string grepped against the fetched text on 2026-08-09.
#
# DROPPED
#   de-dach-ch-permit-is-employer-filed-and-capped — Switzerland-only. The market
#   keys are cn/nl/de/uk/us, so it can never render under any of them, and a
#   renderer that ignored applies_when would show a German applicant Swiss quota
#   advice as their own.
#   de-dach-at-advertised-pay-is-a-floor — Austria-only, same reason. The
#   Austrian/Swiss certificate entry survives because its subject is a document a
#   GERMAN employer will read.
#
# NEXT REVIEW — from review-de.md's "Important and missing", verbatim. Do not
# write these into conventions from this comment; a person must check the source
# first.
#   1. **Blue Card lower salary threshold.** § 18g(1) sentence 2 (verified today) sets a reduced threshold for named ISCO occupation groups — which include ICT and engineering families — and for anyone whose degree is recent. Entry 3 says "a threshold", singular. A candidate below the general figure may wrongly conclude they are ineligible when they sit in a shortage group. Highest-value gap in the set.
#   2. **Job change while holding a Blue Card.** § 18g(4) (verified today): no immigration-authority permission is needed for a job change, but during the first months of employment the authority may suspend and refuse it. This table's user is by definition someone applying to a new employer; a Blue Card holder applying out of their current job has a hard constraint here and nothing in the entry mentions it.
#   3. **KSchG small-business exclusion (§ 23).** Covered above under entry 5; listing separately because it also changes how a candidate should price probation and notice terms at a small employer.
#   4. **§ 81a is not universally available** — restricted to the residence purposes the provision enumerates, and it is initiated by agreement between employer and authority, so an employer with no such Vereinbarung cannot simply opt in late. Entry 3 reads as if the route is always on the table.
#   5. **The Anschreiben's status at international employers.** The entry flags this honestly in `unverified` item 3 and then writes the convention as though the letter is universally screened. Since large international tech employers in Germany routinely run CV-only ATS flows, the gap between "the federal agency treats it as standard" and "this employer wants one" is the operative question — and `applies_when` already half-concedes it ("not routed through an employer portal which explicitly asks for a CV only"). Either source the practice or move the strength of the claim into `applies_when`.
#
#   CORRECTION the reviewer made to the research's own unverified list, recorded
#   here because it is not an entry: the note claiming no official source could be
#   found on the Bewerbungsfoto is wrong — the source is a page
#   de-application-is-a-file-not-a-cv already cites. That note is therefore dropped
#   rather than carried across. Whether the photo becomes a convention is a separate
#   judgement: it is arguably layout, and the same page's treatment of anonymised CVs
#   turns on protected traits.


market: de

conventions:
  - id: "de-arbeitszeugnis-is-a-graded-document"
    text_en: |-
      German employers read the written reference from each of your previous jobs (Arbeitszeugnis)
      as a graded assessment, not a formality. On leaving a job you have a legal claim to a written
      certificate, but you have to assert it, and by default it need only cover the kind and length
      of the work; the fuller version covering performance and conduct is issued only if you ask
      for it — so if you never asked, you do not hold the document recruiters expect to see. Federal
      labour case law places the standard "performed the duties to our full satisfaction" wording
      in the middle of a school-style satisfaction scale running from very good to poor, and holds
      that the grade above it needs the constancy word ("stets") and the word "full" together —
      a reinforcing word on its own does not lift the grade — while the burden sits on you to show
      facts justifying a better closing assessment. The same statute forbids wording that carries
      a hidden message about you, which is your ground for demanding a change. Read every reference
      against that scale before you attach it, and ask a former employer to correct it while the
      relationship is still workable.
    text_zh: |-
      德国雇主会把你每段过往工作的书面证明（Arbeitszeugnis）当作一份带评分的鉴定来读
      ，而不是走过场。离职时法律赋予你索取书面证明的请求权，但需要你主动主张；默认版本只写工作内容
      和时长，含「表现与行为」评价的完整版必须你提出要求才会出具——没提过，就等于没有招聘方期待看
      到的那份文件。联邦劳动法院把「完全令我们满意地完成工作」这类标准措辞定位在一把「满意度刻度」
      的中间档，这把刻度从「很好」一直到「差」；要够到上一档，必须「始终」（stets）与「完全」
      （vollen）同时出现——只有强化词、没有「完全」，档次并不上升。而且，想要更好的总评，举
      证责任在你身上。同一部法律也禁止在证明里夹带暗示性表述，这正是你要求修改的法律依据。因此，附
      上任何一份证明之前，先按这把刻度读一遍；要改，趁与前雇主关系还谈得动的时候提。
    applies_when: "Every application to a German employer where you have prior employment documented in this system, and at every exit from a German job — the time to fix the wording is at exit, not at application."
    added: "2026-08-09"
    review_by: "2027-08-09"
    source:
      kind: "published"
      publisher: "Bundesministerium der Justiz / juris"
      title: "§ 109 GewO - Einzelnorm (Gewerbeordnung)"
      url: "https://www.gesetze-im-internet.de/gewo/__109.html"
      retrieved: "2026-08-09"
      quote: "Der Arbeitnehmer hat … Anspruch auf ein schriftliches Zeugnis. Das Zeugnis muss mindestens Angaben zu Art und Dauer der Tätigkeit (einfaches Zeugnis) enthalten. Der Arbeitnehmer kann verlangen, dass sich die Angaben darüber hinaus auf Leistung und Verhalten … erstrecken. … Es darf keine Merkmale oder Formulierungen enthalten, die den Zweck haben, eine andere als aus der äußeren Form oder aus dem Wortlaut ersichtliche Aussage über den Arbeitnehmer zu treffen."
      note: "The plain certificate is a claim the employee has to assert, not a document that arrives unprompted, which is the whole point of the entry."
      also:
        - publisher: "Bundesarbeitsgericht"
          title: "Decision 9 AZR 584/13 of 18 November 2014"
          url: "https://www.bundesarbeitsgericht.de/entscheidung/9-azr-584-13/"
          retrieved: "2026-08-09"
          quote: "Zufriedenheitsskala … Skala, die von \"sehr gut\" bis hin zu \"mangelhaft\" reicht; \"zur vollen Zufriedenheit\" … wird das der Note \"befriedigend\" zugerechnet"
        - publisher: "Bundesarbeitsgericht"
          title: "Decision 9 AZR 584/13 of 18 November 2014, on the reinforcing wording"
          url: "https://www.bundesarbeitsgericht.de/entscheidung/9-azr-584-13/"
          retrieved: "2026-08-09"
          quote: "\"Gut\" im Sinne der Zufriedenheitsskala ist ein Arbeitnehmer nur dann, wenn ihm bescheinigt wird, er habe \"stets\" … Zufriedenheit des Arbeitgebers gearbeitet"
    why: |-
      The posting asks for "Zeugnisse" as an attachment and says nothing about how the sentences
      inside them are read. A candidate sees polite, positive-sounding German and files it as good
      news, without knowing the closing sentence is being scored — or that the request for the
      graded version had to be made at exit.
  - id: "de-degree-classification-is-a-separate-procedure"
    text_en: |-
      Holding a qualification and having it classified in the German system are not the same thing,
      and are run by different bodies. A public database maintained by the standing conference
      of the state education ministers (anabin) records whether an awarding institution and a given
      degree are recognised, using an institution status marker (H+, H+/-, H-). Separately, the
      central office for foreign education (ZAB) issues an official statement of comparability,
      the Zeugnisbewertung. Many employers ask for it as a precondition for an application, the
      public service among them, and visa and Blue Card EU files require you to evidence comparability.
      It does not by itself entitle you to practise a regulated profession or to enrol in further
      study — those need a separate recognition from the responsible body. Note that anabin does
      not claim to be complete: if your degree or degree type is simply absent, that is not a verdict
      on it, and a Zeugnisbewertung is the route. Start it early — it is an administrative queue.
    text_zh: |-
      「拿到学位」和「学位在德国体系中被归类认定」不是一回事，分属不同机构。各州文教部长联席会议运
      营的公共数据库 anabin 记录颁授院校和具体学位是否被认可，院校带有状态标记（H+、H+/-、
      H-）。另有中央外国教育办公室（ZAB）出具的官方等值说明，称为 Zeugnisbewertung。
      不少雇主把它列为投递的前提条件，公共部门即在其列；申请签证或欧盟蓝卡时，也必须凭它证明学位的
      可比性。它本身并不赋予你从事受管制职业或继续升学的资格——那要向对口主管机构另行申请职业资格
      承认。另需注意：anabin 明确声明数据库并不追求收录完整，你的学位或学位类型查不到，并不
      等于不被认可，此时正确的做法是申请 Zeugnisbewertung。这件事要尽早启动：它是
      行政排队流程。
    applies_when: "Whenever the qualification you are relying on is not itself a German award — most sharply where the employer is a public body, or where the role is a regulated profession."
    added: "2026-08-09"
    review_by: "2027-08-09"
    source:
      kind: "published"
