    why: |-
      A 背调 consent form is presented as a routine signature. It does not tell you where the employer's
      entitlement stops, and no posting tells you that the truthfulness duty on your side has contract-invalidating
      teeth rather than being a matter of taste.
  - id: "cn-hukou-application-is-filed-by-the-employer"
    text_en: |-
      Where a city runs a settlement (落户) scheme for fresh graduates, the applying party can be
      the employer rather than you — in Shanghai it is, the employer files the materials and only
      an employer that itself qualifies under that year's municipal rules can file at all. Whether
      a role can actually carry 落户 is therefore a fact about that specific employer and that year's
      scheme, with its own application window; in Shanghai the employer must tell you truthfully,
      when you sign the 就业协议, whether it qualifies. Ask before accepting, and read the operative
      year's municipal notice — these are city-by-city, reissued annually, and not a nationwide
      entitlement.
    text_zh: |-
      在设有应届生落户通道的城市，申请主体可能是用人单位而不是你本人——上海就是如此：材料由单位提
      交，且只有本身符合该市当年规定条件的单位才有申报资格。所以一个岗位到底能不能落户，取决于这家
      单位和该市当年的政策，还有各自的申请受理期；在上海，单位在与你签就业协议时须如实告知本单位是
      否具备该资格。接受 offer 前就问，并以当年度的市级通知为准——此类政策按城市制定、逐年
      重新发布，全国没有统一待遇。
    applies_when: "You are weighing a role in a city whose 落户 matters to you, particularly as a fresh graduate; ask before, not after, accepting."
    added: "2026-08-09"
    review_by: "2026-11-09"
    source:
      kind: "published"
      publisher: "上海交通大学电气工程学院"
      title: "沪教委学〔2026〕13号, the operative-year 非上海生源应届普通高校毕业生进沪就业 notice, relayed on the school's student-notice page"
      url: "https://see.sjtu.edu.cn/xsgz_tzgg/2395.html"
      retrieved: "2026-08-09"
      quote: "用人单位是非上海生源毕业生进沪就业申请落户的申请主体"
      note: "The scheme is reissued each cycle under a new document number and the earlier notice this entry originally cited is superseded, so read the operative year's municipal notice rather than this relay. The employer-as-applicant mechanic is verified for Shanghai only; other cities run their own schemes that nobody has checked here."
      also:
