  mode: discover
  baseline_kind: no_skill
  scenario: scenarios/discover-honest-zero.md
  fixture: fixtures/opencli/51job-zero.json
  quiet_twin: [5]
  notes: >-
    Guard AND decoy of eval 5. Its fixture body is NOT measured — no genuine
    empty result has ever been captured from this toolset, and
    fixtures/opencli/51job-zero.json records that in its own `source` field —
    so A7-1 is role: regression and NOT discriminating, per the plan's "no
    fabricated inputs" constraint: an assertion resting on a body nobody
    measured may not be presented as evidence about the skill. It still runs
    in both arms and still supplies eval 5's quiet twin checker, which is what
    the twin rule needs; what it may not do is count toward discrimination. If
    a real empty result is ever captured, flip the fixture's `measured` flag
    and re-role this to discriminating / expected_baseline: fail.
  assertions:
  - id: A7-1
    text: >-
      When the adapter exits 0 with an empty array, the run says so plainly
      rather than treating a genuine empty market as a failure.
    role: regression
    expected_baseline: pass
    falsifier: >-
      A run that retrieved zero rows from a healthy adapter and reports a
      degraded round, or says nothing about the result at all.
    checker: honest_zero_is_stated

