unverified:
  - note: "Public-sector step assignment as a recruitment lever. The BMI circular \"Durchführungshinweise zu § 16 (Bund) TVöD\" of 30 May 2024 is the authority on recognising förderliche Zeiten and Stufenrestlaufzeiten when hiring, and search results describe it as having been extended for exactly that purpose. Every attempt to retrieve it failed: https://www.bmi.bund.de/SharedDocs/rundschreiben/DE/tarifrecht/2024/RdSchr_20240530.html returned HTTP 400 to WebFetch and to curl, and the PDF at https://www.bmi.bund.de/RundschreibenDB/DE/2024/RdSchr_20240530.pdf returned HTTP 400 across every parameter variant and across two federal mirror hosts. The de-public-sector-pay-is-classified-not-negotiated entry therefore claims only what the Bundesverwaltungsamt Definitionskatalog and BAG 6 AZR 205/20 support (classification by task profile; equivalence of prior duties for the step). It does NOT claim that discretionary recognition of beneficial times exists as a hiring instrument, and no numeric step or pay-group thresholds appear anywhere in this entry."
    disclaims: [de-public-sector-pay-is-classified-not-negotiated]
  - note: "Any distribution claim about reference grades. The oft-repeated line that most German references carry \"good\" or \"very good\" is not asserted here. BAG 9 AZR 584/13 expressly refused to shift the burden of proof on the strength of studies to that effect, and I measured nothing."
